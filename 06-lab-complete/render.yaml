services:
  - type: web
    name: ai-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        sync: false
  - type: redis
    name: redis-cache
    plan: free
    ipAllowList: []
